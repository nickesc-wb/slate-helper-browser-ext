<!doctype html>
<!--
  The extension popup outside Chrome: stubs chrome.*, loads the isolated-world
  feature scripts listed in manifest.json (so their popup metadata is real),
  builds the state main.js would send, then renders src/popup/popup.html with
  popup.js. Served by serve.mjs at /.claude/playground/popup.html.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Popup playground</title>
  <link rel="stylesheet" href="/src/popup/popup.css">
</head>
<body>
<script>
  const stored = { features: {}, siteOverrides: {} };
  globalThis.chrome = {
    storage: {
      sync: { get: async (defaults) => ({ ...defaults, ...structuredClone(stored) }), set: async (values) => Object.assign(stored, values) },
      local: { get: async () => ({}), set: async () => {} },
      onChanged: { addListener() {} },
    },
    runtime: { getManifest: () => manifest, sendMessage: async () => null, onMessage: { addListener() {} } },
  };
  let manifest;

  const load = (src) => new Promise((done, fail) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = done;
    s.onerror = () => fail(new Error(`failed to load ${src}`));
    document.body.append(s);
  });

  (async () => {
    manifest = await fetch('/manifest.json').then((r) => r.json());
    const isolated = manifest.content_scripts.find((c) => !c.world).js;
    // Everything but detection and main.js: we only want the registrations.
    for (const src of isolated.filter((f) => !/\/(detect|main)\.js$/.test(f))) await load(`/${src}`);

    const SH = globalThis.SlateHelper;
    const state = {
      ready: true, host: 'slate.example.edu', override: 'auto', active: true,
      detection: { isSlate: true, area: 'admin', score: 10, threshold: 5, signals: [] },
      groups: SH.GROUPS, subgroups: SH.SUBGROUPS,
      features: SH.features.map((f) => ({
        id: f.id, group: f.group || 'Other', subgroup: f.subgroup, name: f.name, description: f.description,
        enabled: f.defaultEnabled,
        options: (f.options || []).map((o) => (o.text ? { ...o, value: o.defaultValue } : o.choices
          ? { id: o.id, name: o.name, choices: o.choices, value: o.defaultValue }
          : { id: o.id, name: o.name, note: o.note, requires: o.requires, enabled: o.defaultEnabled })),
        appliesHere: f.areas === '*' || f.areas.includes('admin'),
        running: false,
      })),
    };
    chrome.tabs = { query: async () => [{ id: 1, url: 'https://slate.example.edu/manage/' }], sendMessage: async () => state, reload() {} };

    // popup.html's body, with its relative paths pointed at src/popup/.
    const page = new DOMParser().parseFromString(await fetch('/src/popup/popup.html').then((r) => r.text()), 'text/html');
    page.querySelectorAll('script').forEach((s) => s.remove());
    page.querySelectorAll('img[src]').forEach((img) => { img.src = new URL(img.getAttribute('src'), location.origin + '/src/popup/').href; });
    document.body.prepend(...page.body.childNodes);
    await load('/src/popup/popup.js');
  })();
</script>
</body>
</html>
