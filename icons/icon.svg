<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Slate Helper: a chalk slate (Slate's namesake) on a Slate-blue tile.
       Source for the icon-*.png files. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2584d6"/>
      <stop offset="1" stop-color="#0c4a85"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3d5c"/>
      <stop offset="1" stop-color="#122a42"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <g transform="rotate(-9 64 64)">
    <!-- frame, board -->
    <rect x="17" y="28" width="94" height="72" rx="12" fill="#fff"/>
    <rect x="26" y="37" width="76" height="54" rx="5" fill="url(#board)"/>
    <!-- chalk: </> and a line of "code" -->
    <g class="chalk" fill="none" stroke="#e8f1fa" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 54 L41 64 L50 74"/>
      <path d="M78 54 L87 64 L78 74"/>
      <path d="M68 51 L60 77"/>
    </g>
  </g>

</svg>
