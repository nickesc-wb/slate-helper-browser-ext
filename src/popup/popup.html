<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="../../icons/icon-48.png" alt="" width="30" height="30">
      <div class="brand-text">
        <h1>Slate Helper</h1>
        <div class="host" id="host"></div>
      </div>
    </div>
    <span id="status" class="status"><span class="dot"></span><span id="status-text">…</span></span>
  </header>

  <section id="loading" class="empty" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <p>Checking this page…</p>
  </section>

  <section id="unavailable" class="empty" hidden>
    <p class="empty-title">Not available here</p>
    <p>Slate Helper can't run on this kind of page.</p>
  </section>

  <section id="disconnected" class="empty" hidden>
    <p class="empty-title">Reload to connect</p>
    <p>This page was opened before Slate Helper was installed or updated.</p>
    <button id="reload-disconnected" class="btn primary">Reload page</button>
  </section>

  <main id="main" hidden>
    <section class="card site">
      <div class="site-row">
        <span class="label">This site</span>
        <div class="segmented" id="override" role="radiogroup" aria-label="Slate Helper on this site">
          <button type="button" role="radio" data-value="auto">Auto</button>
          <button type="button" role="radio" data-value="on">On</button>
          <button type="button" role="radio" data-value="off">Off</button>
        </div>
      </div>
      <details class="detect">
        <summary>
          <span id="area" class="chip"></span>
          <span class="score">Detection score <b id="score"></b></span>
        </summary>
        <ul id="signals"></ul>
      </details>
    </section>

    <div id="features"></div>
  </main>

  <div class="version-row">
    <span id="version"></span>
    <span aria-hidden="true">·</span>
    <button type="button" id="check-updates" class="link-btn">Check for updates</button>
    <span id="update-result" role="status"></span>
  </div>

  <footer id="reload-note" class="reload-bar" hidden>
    <span>Reload the page to apply changes</span>
    <button id="reload" class="btn primary small">Reload</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
