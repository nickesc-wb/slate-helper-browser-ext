<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Slate Helper</h1>
    <span id="status" class="pill">…</span>
  </header>

  <section id="unavailable" hidden>
    <p>Slate Helper can't run on this page.</p>
  </section>

  <section id="main" hidden>
    <div class="row">
      <span class="host" id="host"></span>
      <span class="muted" id="area"></span>
    </div>

    <label class="row">
      <span>This site</span>
      <select id="override">
        <option value="auto">Auto-detect</option>
        <option value="on">Always on</option>
        <option value="off">Always off</option>
      </select>
    </label>

    <details>
      <summary>Detection: score <span id="score"></span></summary>
      <ul id="signals"></ul>
    </details>

    <h2>Features</h2>
    <ul id="features"></ul>

    <p id="reload-note" class="note" hidden>
      Changes apply after reload.
      <button id="reload">Reload page</button>
    </p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
